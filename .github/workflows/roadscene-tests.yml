name: RoadScene source and visualization checks

on:
  push:
    paths:
      - 'RoadScene-FailAware/**'
      - '.github/workflows/roadscene-tests.yml'
  pull_request:
    paths:
      - 'RoadScene-FailAware/**'
      - '.github/workflows/roadscene-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: RoadScene-FailAware
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: RoadScene-FailAware/requirements-test.txt
      - name: Install lightweight test dependencies
        run: python -m pip install -r requirements-test.txt
      - name: Repository safety and syntax
        run: python scripts/check_repository.py
      - name: Profile and visualization tests
        run: python -m unittest discover -s tests -v
